<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 90" width="880" height="90" role="img" aria-label="Arrangement shape: intro, build, drop, breakdown, drop, outro">
  <title>Arrangement dynamics — every render follows this shape</title>
  <style>
    @keyframes bar { 0%,100% { transform: scaleY(1); } 50% { transform: scaleY(0.55); } }
    @keyframes cursor { 0% { transform: translateX(0); } 100% { transform: translateX(856px); } }
    .b { transform-box: fill-box; transform-origin: center bottom; animation: bar 1.1s ease-in-out infinite; }
    .cur { animation: cursor 6s linear infinite; }
  </style>
  <rect width="880" height="90" fill="#0a0c10"/>

  <!-- intro 8 / build 8 / drop 16 / breakdown 8 / drop2 16 / outro 8 = 64 bars -->
  <g transform="translate(12 66)">
    <g fill="#fb923c" opacity="0.30">
      <rect class="b" x="0"   y="-14" width="10" height="14" rx="2" style="animation-delay:0s"/>
      <rect class="b" x="13"  y="-17" width="10" height="17" rx="2" style="animation-delay:.1s"/>
      <rect class="b" x="26"  y="-21" width="10" height="21" rx="2" style="animation-delay:.2s"/>
      <rect class="b" x="39"  y="-24" width="10" height="24" rx="2" style="animation-delay:.3s"/>
    </g>
    <g fill="#f472b6" opacity="0.55">
      <rect class="b" x="52"  y="-30" width="10" height="30" rx="2" style="animation-delay:.05s"/>
      <rect class="b" x="65"  y="-34" width="10" height="34" rx="2" style="animation-delay:.15s"/>
      <rect class="b" x="78"  y="-38" width="10" height="38" rx="2" style="animation-delay:.25s"/>
      <rect class="b" x="91"  y="-42" width="10" height="42" rx="2" style="animation-delay:.35s"/>
    </g>
    <g fill="#22d3ee" opacity="0.95">
      <rect class="b" x="104" y="-48" width="10" height="48" rx="2" style="animation-delay:.02s"/>
      <rect class="b" x="117" y="-48" width="10" height="48" rx="2" style="animation-delay:.12s"/>
      <rect class="b" x="130" y="-48" width="10" height="48" rx="2" style="animation-delay:.22s"/>
      <rect class="b" x="143" y="-48" width="10" height="48" rx="2" style="animation-delay:.32s"/>
      <rect class="b" x="156" y="-48" width="10" height="48" rx="2" style="animation-delay:.42s"/>
      <rect class="b" x="169" y="-48" width="10" height="48" rx="2" style="animation-delay:.52s"/>
      <rect class="b" x="182" y="-48" width="10" height="48" rx="2" style="animation-delay:.62s"/>
      <rect class="b" x="195" y="-48" width="10" height="48" rx="2" style="animation-delay:.72s"/>
    </g>
    <g fill="#64748b" opacity="0.35">
      <rect x="208" y="-12" width="10" height="12" rx="2"/>
      <rect x="221" y="-14" width="10" height="14" rx="2"/>
      <rect x="234" y="-11" width="10" height="11" rx="2"/>
      <rect x="247" y="-13" width="10" height="13" rx="2"/>
    </g>
    <g fill="#22d3ee" opacity="0.95">
      <rect class="b" x="260" y="-48" width="10" height="48" rx="2" style="animation-delay:.06s"/>
      <rect class="b" x="273" y="-48" width="10" height="48" rx="2" style="animation-delay:.16s"/>
      <rect class="b" x="286" y="-48" width="10" height="48" rx="2" style="animation-delay:.26s"/>
      <rect class="b" x="299" y="-48" width="10" height="48" rx="2" style="animation-delay:.36s"/>
      <rect class="b" x="312" y="-48" width="10" height="48" rx="2" style="animation-delay:.46s"/>
      <rect class="b" x="325" y="-48" width="10" height="48" rx="2" style="animation-delay:.56s"/>
      <rect class="b" x="338" y="-48" width="10" height="48" rx="2" style="animation-delay:.66s"/>
      <rect class="b" x="351" y="-48" width="10" height="48" rx="2" style="animation-delay:.76s"/>
    </g>
    <g fill="#fb923c" opacity="0.45">
      <rect class="b" x="364" y="-42" width="10" height="42" rx="2" style="animation-delay:.08s"/>
      <rect class="b" x="377" y="-34" width="10" height="34" rx="2" style="animation-delay:.18s"/>
      <rect class="b" x="390" y="-26" width="10" height="26" rx="2" style="animation-delay:.28s"/>
      <rect class="b" x="403" y="-18" width="10" height="18" rx="2" style="animation-delay:.38s"/>
    </g>
    <rect class="cur" x="-2" y="-56" width="2" height="58" fill="#fff" opacity="0.5"/>
    <rect x="-2" y="1" width="856" height="1" fill="#252a33"/>
  </g>

  <g font-family="ui-monospace,Menlo,Consolas,monospace" font-size="9.5" fill="#5c6472" letter-spacing="2">
    <text x="14"  y="86">INTRO</text>
    <text x="86"  y="86">BUILD</text>
    <text x="180" y="86">DROP</text>
    <text x="300" y="86">BREAKDOWN</text>
    <text x="420" y="86">DROP II</text>
    <text x="560" y="86">OUTRO</text>
  </g>
</svg>
