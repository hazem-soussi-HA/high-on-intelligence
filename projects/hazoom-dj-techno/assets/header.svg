<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 260" width="880" height="260" role="img" aria-label="HAZOOM DJ — generative techno engine">
  <title>HAZOOM DJ — generative techno engine</title>
  <defs>
    <linearGradient id="hz" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#fb923c"/>
      <stop offset="0.55" stop-color="#f472b6"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fb923c" stop-opacity="0.25"/>
      <stop offset="0.5" stop-color="#f472b6" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0.25"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fb923c" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#fb923c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    @keyframes bounce { 0%,100% { transform: scaleY(1); } 50% { transform: scaleY(0.35); } }
    @keyframes bounce2 { 0%,100% { transform: scaleY(0.4); } 50% { transform: scaleY(1); } }
    @keyframes sweep { 0% { transform: translateX(0); } 100% { transform: translateX(840px); } }
    @keyframes pulse { 0%,100% { opacity: 0.5; } 50% { opacity: 1; } }
    .b { transform-box: fill-box; transform-origin: center bottom; animation: bounce 1.05s ease-in-out infinite; }
    .b2 { transform-box: fill-box; transform-origin: center bottom; animation: bounce2 1.35s ease-in-out infinite; }
    .sweep { animation: sweep 3.4s linear infinite; }
    .dot { animation: pulse 2.2s ease-in-out infinite; }
  </style>

  <rect width="880" height="260" fill="#0a0c10"/>
  <ellipse cx="440" cy="215" rx="300" ry="60" fill="url(#glow)"/>

  <!-- spectrum: 4-on-the-floor, so the low bars pulse hardest -->
  <g transform="translate(40 176)">
    <g fill="url(#hz)">
      <rect class="b"  x="0"   y="-46" width="7" height="46" rx="3.5" style="animation-delay:0s"/>
      <rect class="b2" x="14"  y="-26" width="7" height="26" rx="3.5" style="animation-delay:.12s"/>
      <rect class="b"  x="28"  y="-38" width="7" height="38" rx="3.5" style="animation-delay:.24s"/>
      <rect class="b2" x="42"  y="-20" width="7" height="20" rx="3.5" style="animation-delay:.36s"/>
      <rect class="b"  x="56"  y="-44" width="7" height="44" rx="3.5" style="animation-delay:.48s"/>
      <rect class="b2" x="70"  y="-30" width="7" height="30" rx="3.5" style="animation-delay:.60s"/>
      <rect class="b"  x="84"  y="-18" width="7" height="18" rx="3.5" style="animation-delay:.72s"/>
      <rect class="b2" x="98"  y="-36" width="7" height="36" rx="3.5" style="animation-delay:.84s"/>
      <rect class="b"  x="112" y="-24" width="7" height="24" rx="3.5" style="animation-delay:.96s"/>
      <rect class="b2" x="126" y="-40" width="7" height="40" rx="3.5" style="animation-delay:1.08s"/>
      <rect class="b"  x="140" y="-22" width="7" height="22" rx="3.5" style="animation-delay:1.20s"/>
      <rect class="b2" x="154" y="-34" width="7" height="34" rx="3.5" style="animation-delay:1.32s"/>
      <rect class="b"  x="168" y="-16" width="7" height="16" rx="3.5" style="animation-delay:1.44s"/>
      <rect class="b2" x="182" y="-28" width="7" height="28" rx="3.5" style="animation-delay:1.56s"/>
    </g>
    <rect x="-4" y="2" width="800" height="2" fill="url(#fade)" opacity="0.5"/>
    <g class="sweep">
      <rect x="-14" y="-56" width="14" height="60" fill="url(#fade)" opacity="0.30"/>
    </g>
  </g>

  <!-- wordmark -->
  <g font-family="ui-monospace,Menlo,Consolas,monospace">
    <text x="440" y="86" text-anchor="middle" font-size="52" font-weight="700"
          letter-spacing="14" fill="url(#hz)">HAZOOM DJ</text>
    <text x="440" y="118" text-anchor="middle" font-size="13" letter-spacing="6.5"
          fill="#8a93a2">GENERATIVE TECHNO ENGINE</text>
    <text x="440" y="140" text-anchor="middle" font-size="11" letter-spacing="3"
          fill="#5c6472">PURE DSP &#183; NO SAMPLES &#183; NO LIBRARIES</text>
  </g>

  <g transform="translate(432 226)">
    <circle class="dot" r="4" fill="#fb923c"/>
  </g>
</svg>
