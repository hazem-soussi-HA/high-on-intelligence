# Aethric — Nginx alternative for the LXC / origin node
# Place at /etc/nginx/sites-available/hoi-aethric ; symlink into sites-enabled ; nginx -t ; systemctl reload nginx

server {
    listen 80;
    server_name hoi.hazem.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name hoi.hazem.example.com;
    root /var/www/hoi.hazem;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/hoi.hazem.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hoi.hazem.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'" always;

    location / { try_files $uri $uri/ /index.html; }
    location = /LEGITIMACY.md { add_header Content-Type text/markdown; }
}
